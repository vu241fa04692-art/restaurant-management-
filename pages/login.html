<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
    <h1>Restaurant Login</h1>
</header>

<main>

    <section class="card">

        <h2>Login</h2>

        <br>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                required
            >

            <br><br>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <br><br>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

    </section>

</main>

<script src="../js/script.js"></script>

</body>
</html>
